name: App Release

# Wird vom Admin-Button in der App ausgelöst (Edge Function trigger-app-update)
# oder manuell über den Actions-Tab. Führt aus, was sonst manuell nötig ist:
# Branches mergen -> Version/Build erhöhen -> committen -> EAS Build + TestFlight
# Submit und/oder Web-Export + Upload auf den Webserver.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Was soll aktualisiert werden?"
        type: choice
        options: [all, apps, web]
        default: all
      bump:
        description: "Versions-Erhöhung (build = nur Build-Nummer, patch = 1.2.x, minor = 1.x.0)"
        type: choice
        options: [build, patch, minor]
        default: build

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Git-Identität setzen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Alle Branches in main mergen
        run: |
          set -e
          MERGED=""
          SKIPPED=""
          for BRANCH in $(git branch -r --format='%(refname:short)' | grep -v 'origin/main$' | grep -v 'origin/HEAD'); do
            NAME="${BRANCH#origin/}"
            # Backup-Branches nie mergen
            case "$NAME" in backup*) SKIPPED="$SKIPPED $NAME (backup)"; continue;; esac
            # Branches ohne gemeinsame Historie überspringen
            if ! git merge-base main "$BRANCH" > /dev/null 2>&1; then
              SKIPPED="$SKIPPED $NAME (keine gemeinsame Historie)"; continue
            fi
            # Bereits gemergte Branches überspringen
            if [ -z "$(git rev-list main..$BRANCH)" ]; then
              continue
            fi
            if git merge --no-edit "$BRANCH"; then
              MERGED="$MERGED $NAME"
            else
              git merge --abort
              SKIPPED="$SKIPPED $NAME (Konflikt)"
            fi
          done
          echo "Gemergt:${MERGED:- keine}"
          echo "Übersprungen:${SKIPPED:- keine}"
          if echo "$SKIPPED" | grep -q "Konflikt"; then
            echo "::warning::Branches mit Konflikten wurden übersprungen:$SKIPPED"
          fi

      - name: Version erhöhen
        if: inputs.target != 'web'
        run: node scripts/bump-app-version.js "${{ inputs.bump }}"

      - name: Änderungen committen und pushen
        run: |
          if git diff --quiet && [ -z "$(git log origin/main..main --oneline)" ]; then
            echo "Keine Änderungen zu pushen."
            exit 0
          fi
          if ! git diff --quiet; then
            VERSION=$(grep -oP 'version: "\K[0-9.]+' app.config.ts)
            BUILD=$(grep -oP 'buildNumber: "\K[0-9]+' app.config.ts)
            git add -A
            git commit -m "chore: Release v${VERSION} (Build ${BUILD}) via App-Update-Button"
          fi
          git push origin main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm-Version kommt aus dem packageManager-Feld der package.json
      - uses: pnpm/action-setup@v4

      - name: Abhängigkeiten installieren
        run: pnpm install --no-frozen-lockfile

      - name: iOS-Build starten (inkl. TestFlight-Submit)
        if: inputs.target == 'apps' || inputs.target == 'all'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Tap-to-Pay-Capability wurde manuell im Apple-Portal aktiviert;
          # der automatische Sync via API schlägt für diese Capability fehl.
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: |
          npx eas-cli build --platform ios --profile production --non-interactive --no-wait --auto-submit
          echo "iOS-Build an EAS übergeben: https://expo.dev/accounts/stibe88/projects/kundenverwaltung/builds"

      - name: Android-Build starten
        if: inputs.target == 'apps' || inputs.target == 'all'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_CAPABILITY_SYNC: "1"
        run: |
          # Nicht blockierend: solange kein Android-Keystore in EAS eingerichtet ist,
          # schlägt dieser Schritt fehl, ohne den Release zu stoppen.
          npx eas-cli build --platform android --profile production --non-interactive --no-wait \
            || echo "::warning::Android-Build konnte nicht gestartet werden (Keystore in EAS eingerichtet? 'npx eas-cli credentials -p android')"

      - name: Web-Export erstellen
        if: inputs.target == 'web' || inputs.target == 'all'
        run: |
          # NativeWind legt .cache/web.css erst während des Builds an; bei frischem
          # node_modules kennt Metro die Datei noch nicht (SHA-1-Fehler). Datei vorab
          # anlegen, und zur Sicherheit einen zweiten Versuch (dann existiert sie sicher).
          mkdir -p node_modules/react-native-css-interop/.cache
          touch node_modules/react-native-css-interop/.cache/web.css
          npx expo export --platform web || npx expo export --platform web

      - name: Web-Portal deployen
        if: inputs.target == 'web' || inputs.target == 'all'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Web-Deploy braucht die Secrets DEPLOY_HOST, DEPLOY_USER und DEPLOY_SSH_KEY (optional DEPLOY_PATH, Standard: public_html/portal)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH:-public_html/portal}/"
          echo "Web-Portal aktualisiert."
