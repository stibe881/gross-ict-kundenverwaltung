  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f0f1a;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #e8e8f0;
    }

    .loader {
      text-align: center;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(212, 164, 50, 0.2);
      border-top-color: #D4A432;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader p {
      color: #8b8ba3;
      font-size: 14px;
    }

    .error {
      color: #ef4444;
      font-size: 16px;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>Ihr Angebot wird geladen…</p>
  </div>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      if (!id) {
        document.getElementById('loader').innerHTML = '<p class="error">Kein Angebot angegeben.</p>';
        return;
      }

      try {
        const res = await fetch(
          'https://bvluvvyvftygnxtmboxw.supabase.co/functions/v1/quote-page?id=' + encodeURIComponent(id)
        );
        const data = await res.json();

        if (data.error) {
          document.getElementById('loader').innerHTML = '<p class="error">' + data.error + '</p>';
          return;
        }

        if (data.html) {
          document.open();
          document.write(data.html);
          document.close();
        }
      } catch (err) {
        document.getElementById('loader').innerHTML = '<p class="error">Fehler beim Laden: ' + err.message + '</p>';
      }
    })();
  </script>
</body>
