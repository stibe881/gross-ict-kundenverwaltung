<!DOCTYPE html>
<html lang="de-CH">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertrag wird geladen… – Gross ICT</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #09090b;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #e5e5e5;
    }

    .loader {
      text-align: center;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(202, 255, 90, 0.2);
      border-top-color: #CAFF5A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader p {
      color: #71717a;
      font-size: 14px;
    }

    .error {
      color: #ef4444;
      font-size: 16px;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>Ihr Vertrag wird geladen…</p>
  </div>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        document.getElementById('loader').innerHTML = '<p class="error">Kein Vertragslink angegeben.</p>';
        return;
      }

      try {
        const res = await fetch(
          'https://bvluvvyvftygnxtmboxw.supabase.co/functions/v1/contract-page?token=' + encodeURIComponent(token)
        );
        const html = await res.text();
        
        document.open();
        document.write(html);
        document.close();
      } catch (err) {
        document.getElementById('loader').innerHTML = '<p class="error">Fehler beim Laden: ' + err.message + '</p>';
      }
    })();
  </script>
</body>

</html>
